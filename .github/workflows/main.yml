---
name: stratis-docs CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  docs-checks:
    runs-on: ubuntu-latest
    container: fedora:44  # CURRENT DEVELOPMENT ENVIRONMENT
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: dnf install -y make lyx 'dnf-command(copr)'
      - name: Enable copr repo
        run: dnf copr enable pgdev/zola --assumeyes
      - name: Install zola
        run: dnf install zola --assumeyes
      - name: Run test
        run: make -f Makefile check

  spelling-and-formatting-checks:
    runs-on: ubuntu-latest
    container: fedora:44  # CURRENT DEVELOPMENT ENVIRONMENT
    steps:
      - name: Install dependencies for Fedora
        run: >
          dnf install -y
          clang
          git
          make
          xmllint
          which
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: cargo
      - name: Run format check
        run: make -f Makefile fmt-ci

  general_checks:
    uses: stratis-storage/github-actions/.github/workflows/reusable_general.yml@master
    with:
      fedora-container-image-number: 44  # CURRENT DEVELOPMENT ENVIRONMENT

  commit-checks:
    uses: stratis-storage/github-actions/.github/workflows/commits.yml@master
    with:
      fedora-container-image-number: 44  # CURRENT DEVELOPMENT ENVIRONMENT
